name: Update Imperial Profile

on:
  schedule:
    # Jalan setiap jam 00:05 WIB (17:05 UTC) dan 12:05 WIB (05:05 UTC)
    - cron: '5 17 * * *'
    - cron: '5 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generate.py'
      - 'profile.json'
      - 'data/palette.json'
      - '.github/workflows/update.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Imperial SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate.py

      - name: Commit & Push updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ data/stats.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): update imperial svgs [skip ci]"
            git push
          fi