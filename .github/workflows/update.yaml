name: Update Imperial Profile

on:
  schedule:
    # Jalan otomatis setiap hari pukul 00:05 WIB (17:05 UTC) & setiap 6 jam sekali
    - cron: "5 17 * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch: # Tombol manual "Run workflow" di tab Actions
  push:
    paths:
      - "generate.py"
      - "data/palette.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Imperial SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python generate.py

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/stats.json README.md
          git diff --staged --quiet || git commit -m "chore: update imperial profile stats"
          git push